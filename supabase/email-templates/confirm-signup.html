<!-- Supabase → Authentication → Emails → "Confirm sign up".
     Assunto: Confirm your No Sweat account
     Só HTML com estilo na linha (e-mail não aceita CSS externo). {{ .ConfirmationURL }} é do Supabase. -->
<div style="margin:0;padding:32px 16px;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#16202a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto">
    <tr>
      <td style="padding:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-0.01em">No Sweat</td>
    </tr>
    <tr>
      <td style="background:#ffffff;border:1px solid #dfe4e9;border-radius:12px;padding:32px">
        <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25">Confirm your email</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#4a5866">
          Welcome! Tap the button to confirm your email and start building your website.
        </p>
        <p style="margin:0 0 24px">
          <a href="{{ .ConfirmationURL }}"
             style="display:inline-block;background:#005ce6;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px">
            Confirm my email
          </a>
        </p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#4a5866">
          If the button doesn't work, copy this link into your browser:<br />
          <a href="{{ .ConfirmationURL }}" style="color:#005ce6;word-break:break-all">{{ .ConfirmationURL }}</a>
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 4px 0;font-size:13px;line-height:1.6;color:#6b7785">
        Didn't create an account? You can ignore this email.<br />
        No Sweat · nosweatfd.com
      </td>
    </tr>
  </table>
</div>

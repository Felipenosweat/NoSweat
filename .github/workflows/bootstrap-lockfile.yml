# TEMPORÁRIO: gera o pnpm-lock.yaml (o ambiente onde o projeto foi criado não tinha acesso ao npm),
# roda as checagens e commita o lockfile de volta na branch. Apagar depois que o lockfile existir.
name: Bootstrap lockfile

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install (generates pnpm-lock.yaml)
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Test
        run: pnpm test
        continue-on-error: true
      - name: Build
        run: pnpm build
        continue-on-error: true

      - name: Commit lockfile
        run: |
          if git diff --quiet --exit-code -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add pnpm-lock.yaml"
          git push

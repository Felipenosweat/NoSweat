# TEMPORÁRIO: o ambiente que escreve este código não acessa o npm. Este workflow adiciona as
# dependências novas, atualiza o pnpm-lock.yaml, roda as checagens e commita de volta na branch.
# Apagar depois do uso.
name: Bootstrap dependencies

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Add Supabase packages to apps/web
        run: |
          if ! grep -q '"@supabase/ssr"' apps/web/package.json; then
            pnpm --filter @nosweat/web add @supabase/ssr @supabase/supabase-js
          fi
          pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Test
        run: pnpm test
        continue-on-error: true
      - name: Build
        run: pnpm build
        continue-on-error: true

      - name: Commit package.json and lockfile
        run: |
          if git diff --quiet -- apps/web/package.json pnpm-lock.yaml; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m "chore(deps): add @supabase/ssr and @supabase/supabase-js"
          git push

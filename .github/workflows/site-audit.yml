name: Site audit

# Prints e erros do site no ar. Roda no push da branch de trabalho (quando estes arquivos mudam);
# (prints + report.json) é commitado na própria branch, em qa/out/.
on:
  push:
    branches: ["claude/dreamy-maxwell-19fv98"]
    paths: ["qa/audit.mjs", ".github/workflows/site-audit.yml", "qa/trigger.txt"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm init -y >/dev/null && npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/audit.mjs
      - name: Commit results
        run: |
          git config user.name "site-audit"
          git config user.email "site-audit@users.noreply.github.com"
          git add -f qa/out
          git commit -m "chore(qa): site audit results [skip ci]" || exit 0
          git push

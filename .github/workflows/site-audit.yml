name: Site audit

# Prints e erros do site no ar. Roda no push da branch de trabalho (quando estes arquivos mudam);
# (prints + report.json) vai para a ref refs/qa/site-audit (fora da branch).
on:
  push:
    branches: ["claude/dreamy-maxwell-19fv98"]
    paths: ["qa/*.mjs", ".github/workflows/site-audit.yml", "qa/trigger.txt"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # Fora do monorepo (pnpm): só o Playwright, numa pasta separada.
      - name: Install Playwright
        run: |
          mkdir -p /tmp/qa && cp qa/*.mjs /tmp/qa/
          cd /tmp/qa && npm init -y >/dev/null && npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit
        run: cd /tmp/qa && OUT_DIR="$GITHUB_WORKSPACE/qa/out" node audit.mjs
      - name: Landing build layers
        run: cd /tmp/qa && OUT_DIR="$GITHUB_WORKSPACE/qa/out" node build-layers.mjs
      # Prints fora da branch (não sujam o PR nem pulam o CI): ref refs/qa/site-audit.
      - name: Publish results to refs/qa/site-audit
        run: |
          cd qa/out
          git init -q -b results && git add -A
          git -c user.name="site-audit" -c user.email="site-audit@users.noreply.github.com" commit -qm "site audit results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results:refs/qa/site-audit
